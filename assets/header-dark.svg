<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240">
  <style>
    .t { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; fill: #ECE8E1; }
    .m { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #8A8780; letter-spacing: .08em; }
    .fog { fill: none; stroke: #3A3C40; stroke-width: 1; stroke-linecap: round; }
    .a { animation: drift 18s ease-in-out infinite alternate; }
    .b { animation: drift 24s ease-in-out infinite alternate-reverse; }
    .c { animation: drift 30s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(30px); } }
    .cur { animation: blink 1.1s steps(1) infinite; fill: #8A8780; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .a, .b, .c, .cur { animation: none; } }
  </style>
  <rect width="880" height="240" rx="14" fill="#101113"/>
  <g opacity=".9" transform="translate(0 18)">
    <path class="fog a" d="M-40 168 C 120 150, 260 186, 420 166 S 720 150, 920 172"/>
    <path class="fog b" d="M-40 184 C 140 170, 300 200, 470 182 S 760 168, 920 188" opacity=".7"/>
    <path class="fog c" d="M-40 200 C 100 192, 320 214, 500 198 S 780 190, 920 206" opacity=".45"/>
  </g>
  <text x="48" y="58" class="m" font-size="12">CHAPEL HILL, NC · 35.91° N</text>
  <text x="46" y="118" class="t" font-size="52" font-style="italic">vasu bansal</text>
  <text x="48" y="150" class="m" font-size="13">engineer &amp; photographer — still figuring out what to build next<tspan class="cur"> ▍</tspan></text>
</svg>
